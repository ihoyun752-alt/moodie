<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 글꼴 비교 — moodie. (개발용)</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display&family=Great+Vibes&family=Inter:wght@400;500&family=Noto+Serif+KR:wght@500;600&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/hero-art.css">
  <style>
    .compare { padding-top: 48px; }
    .compare h1 { font-family: var(--font-heading); font-size: 32px; color: var(--color-ink); }
    .compare__lead { margin-top: 12px; color: var(--color-muted); }
    .compare__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 621px), 1fr));
      gap: 32px 24px;
      margin-top: 36px;
    }
    .compare__item { margin: 0; }
    .compare__item .hero-art { max-width: 621px; border-radius: 12px; }
    .compare__item figcaption { margin-top: 12px; font-size: 15px; }
    .compare__item figcaption strong { color: var(--color-ink); }
    .compare__item figcaption a { margin-left: 8px; font-size: 14px; color: var(--color-muted); }
    .hero-art--plain .hero-art__veil,
    .hero-art--plain .hero-art__script,
    .hero-art--veil-only .hero-art__script { display: none; }
  </style>
</head>
<body>
  <main class="container compare">
    <h1>손글씨 글꼴 비교 (개발용 화면)</h1>
    <p class="compare__lead">
      히어로 장식의 깨진 손글씨를 흐림 베일로 가리고, 그 위에 HTML 글자 “Find your mood”를 올린 모습입니다.
      이미지 파일(powder.png)은 수정하지 않았습니다. 최종 글꼴을 고르면 이 화면은 삭제합니다.
    </p>

    <div class="compare__grid">
      <figure class="compare__item">
        <div class="hero-art" data-script="pinyon" aria-hidden="true">
          <img src="../assets/hero/powder.png" alt="" width="621" height="263">
          <span class="hero-art__veil"></span>
          <span class="hero-art__script"><span>Find</span><span>your</span><span>mood</span></span>
        </div>
        <figcaption><strong>A. Pinyon Script</strong> — 가장 가늘고 고전적
          <a href="../mood.html?script=pinyon">실제 화면에서 보기</a></figcaption>
      </figure>

      <figure class="compare__item">
        <div class="hero-art" data-script="allura" aria-hidden="true">
          <img src="../assets/hero/powder.png" alt="" width="621" height="263">
          <span class="hero-art__veil"></span>
          <span class="hero-art__script"><span>Find</span><span>your</span><span>mood</span></span>
        </div>
        <figcaption><strong>B. Allura</strong> — 중간 굵기 (현재 임시 기본값)
          <a href="../mood.html?script=allura">실제 화면에서 보기</a></figcaption>
      </figure>

      <figure class="compare__item">
        <div class="hero-art" data-script="greatvibes" aria-hidden="true">
          <img src="../assets/hero/powder.png" alt="" width="621" height="263">
          <span class="hero-art__veil"></span>
          <span class="hero-art__script"><span>Find</span><span>your</span><span>mood</span></span>
        </div>
        <figcaption><strong>C. Great Vibes</strong> — 가장 굵고 화려함
          <a href="../mood.html?script=greatvibes">실제 화면에서 보기</a></figcaption>
      </figure>

      <figure class="compare__item">
        <div class="hero-art hero-art--veil-only" aria-hidden="true">
          <img src="../assets/hero/powder.png" alt="" width="621" height="263">
          <span class="hero-art__veil"></span>
        </div>
        <figcaption><strong>참고: 흐림 베일만</strong> — 깨진 손글씨가 얼마나 가려지는지 확인</figcaption>
      </figure>

      <figure class="compare__item">
        <div class="hero-art hero-art--plain" aria-hidden="true">
          <img src="../assets/hero/powder.png" alt="" width="621" height="263">
        </div>
        <figcaption><strong>참고: 원본 그대로</strong> — 처리 전 (손글씨가 깨져 있음)</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
